[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-drawer"
version = "0.2.0"
description = "Programmable desktop 2-D geometric CAD"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
geometric-drawer = "geometric_drawer.main:main"

[tool.setuptools]
packages = ["geometric_drawer"]
include-package-data = false
package-dir = {geometric_drawer = "."}

[tool.setuptools.package-data]
geometric_drawer = ["examples/*.cad"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
