name: CAD checks
on: [push, pull_request]
jobs:
  cad:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt build
      - run: python -m pytest -q
      - run: python -m build
      - name: Linux native GUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          CAD_GUI_TESTS=1 xvfb-run -a python -m pytest -q tests/test_ui.py tests/test_features_gui.py tests/test_advanced_gui.py tests/test_parametric_gui.py tests/test_assemblies_gui.py
